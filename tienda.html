<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda LDO</title>

<style>
body{
background:#020617;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#0f172a;
padding:15px;
border-radius:15px;
text-align:center;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
}

.precio{
font-size:24px;
font-weight:bold;
color:#38bdf8;
}

.whatsapp{
display:inline-block;
margin-top:10px;
background:#25d366;
color:white;
padding:10px 15px;
border-radius:10px;
text-decoration:none;
}

.cat-btn{
background:#0f172a;
color:white;
border:1px solid #1e293b;
padding:12px 18px;
border-radius:25px;
cursor:pointer;
transition:.3s;
font-size:15px;
margin:3px;
}

.cat-btn:hover{
transform:translateY(-3px);
background:#38bdf8;
box-shadow:0 0 20px rgba(56,189,248,.4);
}

.cat-btn:active{
transform:scale(.95);
}

.buscador{
width:100%;
max-width:500px;
padding:15px 20px;
border:none;
border-radius:30px;
background:#0f172a;
color:white;
font-size:16px;
outline:none;
box-shadow:0 0 15px rgba(56,189,248,.2);
transition:.3s;
}

.buscador:focus{
box-shadow:0 0 25px rgba(56,189,248,.5);
transform:scale(1.02);
}
  
</style>
</head>

<body>

<div style="
background:linear-gradient(135deg,#38bdf8,#84cc16);
padding:30px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
">

<h1 style="margin:0;color:white">
🛒 Tienda LDO
</h1>

<p style="margin-top:10px;color:white">
Celulares • Fundas • Vidrios • Cargadores • Electrónica
</p>

</div>

<input
id="buscar"
class="buscador"
placeholder="🔍 Buscar producto...">
  
<div style="text-align:center;margin-bottom:20px">

<h2 style="text-align:center">
🔥 Productos Destacados
</h2>

<div class="filtros">
  
<button class="cat-btn" onclick="filtrarCategoria('Todas')">Todos</button>

<button class="cat-btn" onclick="filtrarCategoria('Celulares')">📱 Celulares</button>

<button class="cat-btn" onclick="filtrarCategoria('Accesorios')">🔌 Accesorios</button>

<button class="cat-btn" onclick="filtrarCategoria('Protección')">🛡️ Protección</button>

<button class="cat-btn" onclick="filtrarCategoria('Electrónica')">⚡ Electrónica</button>

<button class="cat-btn" onclick="filtrarCategoria('Ofertas')">🔥 Ofertas</button>

<button class="cat-btn" onclick="filtrarCategoria('Novedades')">✨ Novedades</button>

</div>
  
<div
id="carritoBox"
onclick="verCarrito()"
style="
position:fixed;
top:15px;
right:15px;
background:#38bdf8;
color:#020617;
padding:10px 15px;
border-radius:20px;
font-weight:bold;
z-index:999;
box-shadow:0 0 15px rgba(56,189,248,.5);
cursor:pointer;
">
🛒 0
</div>
  
<div id="productos" class="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>

<script>

let todosProductos = [];
let carrito = JSON.parse(
localStorage.getItem('carritoLDO')
) || [];

function filtrarCategoria(categoria){

const productos =
categoria === 'Todas'
? todosProductos
: todosProductos.filter(
p => p.categoria === categoria
);

mostrarProductos(productos);

}
  
async function cargarProductos(){

const {data,error}=await supabaseClient
.from('productos')
.select('*')
.gt('stock',0)
.order('categoria',{ascending:true})
.order('id',{ascending:false});

if(error){
console.log(error);
alert(error.message);
return;
}

todosProductos = data;

mostrarProductos(data);

}

function mostrarProductos(data){

const div=document.getElementById('productos');

div.innerHTML='';

data.forEach(p=>{

const mensaje=encodeURIComponent(
`Hola, me interesa este producto:\n\n${p.nombre}`
);

div.innerHTML+=`
<div class="card">

<img src="${p.foto || ''}">

<h3>${p.nombre}</h3>

<div style="
background:#38bdf8;
color:#020617;
padding:4px 8px;
border-radius:8px;
display:inline-block;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
">
${p.categoria || 'General'}
</div>

<p style="
color:#cbd5e1;
font-size:14px;
margin:10px 0;
min-height:40px;
">
${p.descripcion || ''}
</p>

<p>🏷️ ${p.categoria || 'Sin categoría'}</p>

<div class="precio">
$${Number(p.precio).toLocaleString()}
</div>

<p>
${p.stock > 0
? '🟢 Disponible (' + p.stock + ')'
: '🔴 Agotado'}
</p>

${p.stock > 0 ? `
<button
onclick="agregarCarrito(${p.id})"
class="whatsapp"
style="
border:none;
cursor:pointer;
">
🛒 Agregar
</button>
` : `
<div class="whatsapp">
🔴 Sin stock
</div>
`}

</div>
`;

});

}

function agregarCarrito(id){

const existente =
carrito.find(p => p.id === id);

if(existente){

existente.cantidad++;

}else{

const producto =
todosProductos.find(p => p.id === id);

carrito.push({
...producto,
cantidad:1
});

}

actualizarCarrito();

}

function actualizarCarrito(){
  
  localStorage.setItem(
'carritoLDO',
JSON.stringify(carrito)
);

document.getElementById('carritoBox').innerHTML =
`🛒 ${carrito.length}`;

}

function verCarrito(){

if(carrito.length === 0){
alert('El carrito está vacío');
return;
}

let texto = '🛒 CARRITO\n\n';

let total = 0;

carrito.forEach((p,index)=>{

texto += `${index + 1}. ${p.nombre} x${p.cantidad} - $${(Number(p.precio) * p.cantidad).toLocaleString()}\n`;

total += Number(p.precio) * p.cantidad;

});

texto += `\n💰 Total: $${total.toLocaleString()}`;

const accion = prompt(
texto +
'\n\nEscribí:\n' +
'1 = Enviar WhatsApp\n' +
'2 = Vaciar carrito\n' +
'3 = Eliminar producto'
);

if(accion === '1'){
finalizarPedido();
}

if(accion === '2'){
carrito = [];
actualizarCarrito();
alert('🗑️ Carrito vaciado');
}

if(accion === '3'){

const numero = prompt(
'Ingresá el número del producto a eliminar'
);

const indice = Number(numero) - 1;

if(indice >= 0 && indice < carrito.length){

carrito.splice(indice,1);

actualizarCarrito();

alert('✅ Producto eliminado');

}

}

}

function finalizarPedido(){

if(carrito.length === 0){
alert('El carrito está vacío');
return;
}

let mensaje = '🛒 NUEVO PEDIDO%0A%0A';

let total = 0;

carrito.forEach(p=>{

mensaje += `📦 ${p.nombre} - $${p.precio}%0A`;

total += Number(p.precio);

});

mensaje += `%0A💰 Total: $${total.toLocaleString()}%0A%0A`;
mensaje += 'Hola, quiero realizar este pedido.';

window.open(
`https://wa.me/543756432527?text=${mensaje}`,
'_blank'
);

}

function buscarProductos(){

const texto =
document.getElementById('buscarProducto')
.value
.toLowerCase();

const filtrados = todosProductos.filter(p =>

(p.nombre || '')
.toLowerCase()
.includes(texto)

);

mostrarProductos(filtrados);

}
  
cargarProductos();

actualizarCarrito();

</script>

</body>
</html>
