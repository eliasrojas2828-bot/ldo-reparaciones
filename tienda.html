<script>

let todosProductos = [];
let carrito = JSON.parse(
localStorage.getItem('carritoLDO')
) || [];

function filtrarCategoria(categoria){

let productos = todosProductos;

if(categoria === 'nuevos'){

productos = todosProductos.filter(
p => p.tipo === 'nuevo'
);

}

else if(categoria === 'reacondicionados'){

productos = todosProductos.filter(
p => p.tipo === 'reacondicionado'
);

}

else if(categoria !== 'Todas'){

productos = todosProductos.filter(
p => p.categoria === categoria
);

}

mostrarProductos(productos);

}
  
async function cargarProductos(){

const {data,error}=await supabaseClient
.from('productos')
.select('*')
.gt('stock',0)
.order('categoria',{ascending:true})
.order('id',{ascending:false});

if(error){
console.log(error);
alert(error.message);
return;
}

todosProductos = data;

mostrarProductos(data);

}

function mostrarProductos(data){

const div=document.getElementById('productos');

div.innerHTML='';

data.forEach(p=>{

const mensaje=encodeURIComponent(
`Hola, me interesa este producto:\n\n${p.nombre}`
);

div.innerHTML+=`
<div
class="card"
onclick="abrirProducto(${p.id})"
>

${p.tipo ? `

<div class="
${p.tipo === 'nuevo'
? 'badgeNuevo'
: 'badgeReac'}
">

${p.tipo === 'nuevo'
? '🆕 NUEVO'
: '♻️ REACONDICIONADO'}

</div>

` : ''}

<img src="${p.foto || ''}">

<h3>${p.nombre}</h3>

<div style="
background:#38bdf8;
color:#020617;
padding:4px 8px;
border-radius:8px;
display:inline-block;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
">
${p.categoria || 'General'}
</div>

<p style="
color:#cbd5e1;
font-size:16px;
font-weight:500;
margin:10px 0;
min-height:40px;
">
${p.descripcion || ''}
</p>

<div class="precio">
$${Number(p.precio).toLocaleString()}
</div>

<p>
${p.stock > 0
? '🟢 Disponible'
: '🔴 Agotado'}
</p>

${p.stock > 0 ? `
<button
onclick="agregarCarrito(${p.id})"
class="whatsapp"
style="
border:none;
cursor:pointer;
">
🛒 Agregar
</button>
` : `
<div class="whatsapp">
🔴 Sin stock
</div>
`}

</div>
`;

});

}

function agregarCarrito(id){
  
function mostrarToast(){

const toast =
document.getElementById('toastCarrito');

toast.style.display = 'block';

setTimeout(()=>{

toast.style.display = 'none';

},2000);

}

const existente =
carrito.find(p => p.id === id);

if(existente){

existente.cantidad++;

}else{

const producto =
todosProductos.find(p => p.id === id);

carrito.push({
...producto,
cantidad:1
});

}

mostrarToast();

actualizarCarrito();

}

function actualizarCarrito(){

localStorage.setItem(
'carritoLDO',
JSON.stringify(carrito)
);

let total = 0;

carrito.forEach(p=>{
total += Number(p.precio) * (p.cantidad || 1);
});

document.getElementById('contadorCarrito').innerHTML =
carrito.length;

document.getElementById('totalHeader').innerHTML =
'$' + total.toLocaleString();

}

function verCarrito(){

const lista =
document.getElementById('listaCarrito');

const totalBox =
document.getElementById('totalCarrito');

lista.innerHTML = '';

let total = 0;

carrito.forEach((p,index)=>{

const subtotal =
Number(p.precio) * p.cantidad;

total += subtotal;

lista.innerHTML += `
<div style="
display:flex;
justify-content:space-between;
align-items:center;
background:white;
padding:10px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,.08);
margin-bottom:10px;
gap:10px;
">

<img
src="${p.foto || ''}"
style="
width:70px;
height:70px;
object-fit:cover;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.12);
">

<div>
<div style="
font-size:20px;
font-weight:bold;
color:#020617;
">
${p.nombre}
</div>

<div style="
display:flex;
align-items:center;
gap:8px;
margin-top:5px;
">

<button
onclick="restarCantidad(${index})"
style="
background:#ef4444;
color:white;
border:none;
border-radius:6px;
padding:4px 8px;
cursor:pointer;
width:40px;
height:40px;
font-size:18px;
box-shadow:0 0 10px rgba(239,68,68,.3);
">
➖
</button>

<b>${p.cantidad}</b>

<button
onclick="sumarCantidad(${index})"
style="
background:#22c55e;
color:white;
border:none;
border-radius:12px;
padding:4px 8px;
cursor:pointer;
width:40px;
height:40px;
font-size:18px;
box-shadow:0 0 10px rgba(34,197,94,.3);
">
➕
</button>

</div>

<div style="margin-top:5px">
<div style="
margin-top:8px;
font-size:24px;
font-weight:bold;
color:#22c55e;
font-size:18px;
width:40px;
height:40px;
">
<div style="
margin-top:8px;
font-size:24px;
font-weight:bold;
color:#22c55e;
">
<div style="
margin-top:8px;
font-size:24px;
font-weight:bold;
color:#22c55e;
">
<div style="
margin-top:8px;
font-size:24px;
font-weight:bold;
color:#22c55e;
">
$${subtotal.toLocaleString()}
</div>

</div>

<button
onclick="eliminarDelCarrito(${index})"
style="
background:#ef4444;
color:white;
border:none;
padding:8px 10px;
border-radius:8px;
">
❌
</button>

</div>
`;

});

totalBox.innerHTML =
`💰 Total: $${total.toLocaleString()}`;

document.getElementById('modalCarrito').style.display =
'flex';

}

function cerrarCarrito(){

document.getElementById('modalCarrito').style.display =
'none';

}

function eliminarDelCarrito(index){

carrito.splice(index,1);

actualizarCarrito();

verCarrito();

}

function sumarCantidad(index){

carrito[index].cantidad++;

actualizarCarrito();

verCarrito();

}

function restarCantidad(index){

if(carrito[index].cantidad > 1){

carrito[index].cantidad--;

}else{

carrito.splice(index,1);

}

actualizarCarrito();

verCarrito();

}

function vaciarCarrito(){

if(!confirm('¿Vaciar todo el carrito?')){
return;
}

carrito = [];

localStorage.removeItem('carritoLDO');

actualizarCarrito();

cerrarCarrito();

}

function finalizarPedido(){

if(carrito.length === 0){
alert('El carrito está vacío');
return;
}

const metodoPago =
document.getElementById('metodoPago').value;

const tipoEntrega =
document.getElementById('tipoEntrega').value;

const direccion =
document.getElementById('direccionCliente').value;

let mensaje =
'🛒 *NUEVO PEDIDO LDO*%0A%0A';

let total = 0;

carrito.forEach(p=>{

const subtotal =
Number(p.precio) * p.cantidad;

mensaje +=
`📦 ${p.nombre} x${p.cantidad} - $${subtotal.toLocaleString()}%0A`;

total += subtotal;

});

mensaje += `%0A`;

mensaje +=
`💳 Pago: ${metodoPago}%0A`;

mensaje +=
`🚚 Modalidad: ${tipoEntrega}%0A`;

if(tipoEntrega === 'Envío'){

mensaje +=
`📍 Dirección:%0A${direccion}%0A`;

}

mensaje += `%0A`;

mensaje +=
`💰 TOTAL: $${total.toLocaleString()}%0A%0A`;

mensaje +=
'🙌 Gracias por comprar en LDO Service';

window.open(
`https://wa.me/543756432527?text=${mensaje}`,
'_blank'
);

carrito = [];

actualizarCarrito();

cerrarCarrito();

localStorage.removeItem('carritoLDO');

alert('✅ Pedido enviado correctamente');

}

function buscarProductos(){

const texto =
document.getElementById('buscar')
.value
.toLowerCase();

const filtrados = todosProductos.filter(p =>

(p.nombre || '')
.toLowerCase()
.includes(texto)

);

mostrarProductos(filtrados);

}
  
cargarProductos();

actualizarCarrito();

function abrirMenu(){
  
document.addEventListener('click', function(e){

const menu =
document.getElementById('menuFloat');

const boton =
document.getElementById('menuBtn');

if(
menu.style.display === 'block' &&
!menu.contains(e.target) &&
!boton.contains(e.target)
){

menu.style.display = 'none';

}

});

const menu =
document.getElementById('menuFloat');

if(menu.style.display === 'block'){

menu.style.display = 'none';

}else{

menu.style.display = 'block';

}

}

let temaOscuro = true;

function toggleTema(){

if(temaOscuro){

document.body.style.background = '#f1f5f9';
document.body.style.color = '#020617';

temaOscuro = false;

}else{

document.body.style.background = '#020617';
document.body.style.color = 'white';

temaOscuro = true;

}

}

let animacionesActivas = true;

function toggleAnimaciones(){

animacionesActivas = !animacionesActivas;

if(animacionesActivas){

document.body.style.scrollBehavior = 'smooth';

alert('⚡ Animaciones activadas');

}else{

document.body.style.scrollBehavior = 'auto';

alert('⛔ Animaciones desactivadas');

}

}

function cambiarEntrega(){

const tipo =
document.getElementById('tipoEntrega').value;

const box =
document.getElementById('boxDireccion');

if(tipo === 'Envío'){

box.style.display = 'block';

}else{

box.style.display = 'none';

}

}

function cambiarPago(){

const metodo =
document.getElementById('metodoPago').value;

const box =
document.getElementById('datosTransferencia');

if(metodo === 'Transferencia'){

box.style.display = 'block';

}else{

box.style.display = 'none';

}

}

<script>

if('serviceWorker' in navigator){

navigator.serviceWorker
.register('/service-worker.js')

.then(()=>{

console.log('✅ Service Worker registrado');

});

}

function toggleCelulares(){

const menu =
document.getElementById('submenuCelulares');

menu.style.display =
menu.style.display === 'flex'
? 'none'
: 'flex';

}

document.addEventListener('click', function(e){

const menu =
document.getElementById('submenuCelulares');

const contenedor =
document.querySelector('.menuCelulares');

if(
menu.style.display === 'flex' &&
!contenedor.contains(e.target)
){

menu.style.display = 'none';

}

});

function abrirProducto(id){

const p =
todosProductos.find(x => x.id === id);

const div =
document.getElementById('contenidoProducto');

div.innerHTML = `

<div style="position:relative">

${[p.foto,p.foto2,p.foto3]
.filter(f=>f).length > 1 ? `

<div
onclick="moverSlider(-1)"
style="
position:absolute;
left:10px;
top:50%;
transform:translateY(-50%);
z-index:10;
background:rgba(0,0,0,.4);
width:45px;
height:45px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
color:white;
backdrop-filter:blur(10px);
">
‹
</div>

` : ''}

<div
id="dotsSlider"
style="
display:flex;
justify-content:center;
gap:8px;
margin-top:-5px;
margin-bottom:15px;
">

${[p.foto,p.foto2,p.foto3]
.filter(f=>f)
.map((_,i)=>`

<div
class="dotSlider"
style="
width:10px;
height:10px;
border-radius:50%;
background:${i===0 ? '#38bdf8' : 'rgba(255,255,255,.35)'};
transition:.3s;
">
</div>

`).join('')}

</div>

`).join('')}

</div>

${[p.foto,p.foto2,p.foto3]
.filter(f=>f).length > 1 ? `

<div
onclick="moverSlider(1)"
style="
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
z-index:10;
background:rgba(0,0,0,.4);
width:45px;
height:45px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
color:white;
backdrop-filter:blur(10px);
">
›
</div>

` : ''}

<div 
id="sliderFotos"
onscroll="actualizarDots()"
style="
display:flex;
gap:10px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding-bottom:10px;
scroll-behavior:smooth;
">

${[p.foto,p.foto2,p.foto3]
.filter(f=>f)
.map(f=>`

<img
src="${f}"
onclick="zoomImagen('${f}')"
style="
min-width:100%;
height:320px;
object-fit:cover;
border-radius:20px;
scroll-snap-align:center;
flex-shrink:0;
cursor:pointer;
">

`).join('')}

</div>

</div>

<h1 style="
margin-top:20px;
font-size:32px;
">
${p.nombre}
</h1>

<div style="
background:#38bdf8;
color:#020617;
padding:8px 14px;
border-radius:12px;
display:inline-block;
font-weight:bold;
margin-top:10px;
">
${p.categoria || 'General'}
</div>

<p style="
margin-top:20px;
font-size:18px;
color:#cbd5e1;
line-height:1.6;
">
${p.descripcion || ''}
</p>

<h2 style="
font-size:42px;
color:#38bdf8;
margin-top:20px;
">
$${Number(p.precio).toLocaleString()}
</h2>

<button
onclick="agregarCarrito(${p.id})"
style="
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:linear-gradient(135deg,#38bdf8,#84cc16);
color:white;
font-size:22px;
font-weight:bold;
margin-top:20px;
">
🛒 Agregar al carrito
</button>

<button
onclick="cerrarProducto()"
style="
width:100%;
padding:15px;
border:none;
border-radius:18px;
background:#334155;
color:white;
margin-top:10px;
font-size:18px;
">
Cerrar
</button>

`;

document.getElementById('modalProducto')
.style.display = 'flex';

}

function cerrarProducto(){

document.getElementById('modalProducto')
.style.display = 'none';

}

function zoomImagen(src){

document.getElementById('imgZoom').src =
src;

document.getElementById('modalZoom')
.style.display = 'flex';

}

function cerrarZoom(){

document.getElementById('modalZoom')
.style.display = 'none';

}

function moverSlider(direccion){

const slider =
document.getElementById('sliderFotos');

slider.scrollBy({
left:direccion * 320,
behavior:'smooth'
});

}

function actualizarDots(){

const slider =
document.getElementById('sliderFotos');

const dots =
document.querySelectorAll('.dotSlider');

const index =
Math.round(
slider.scrollLeft / slider.offsetWidth
);

dots.forEach((dot,i)=>{

dot.style.background =
i === index
? '#38bdf8'
: 'rgba(255,255,255,.35)';

});

}

</script>

<div 
id="modalProducto"
onclick="cerrarProducto()"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
backdrop-filter:blur(10px);
z-index:999999;
justify-content:center;
align-items:center;
padding:20px;
box-sizing:border-box;
">

<div 
id="contenidoProducto" 
onclick="event.stopPropagation()"
style="
background:#0f172a;
width:100%;
max-width:450px;
border-radius:30px;
overflow:auto;
max-height:90%;
padding:20px;
box-sizing:border-box;
box-shadow:0 0 40px rgba(56,189,248,.25);
">

</div>

</div>

<div
id="modalZoom"
onclick="cerrarZoom()"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
backdrop-filter:blur(10px);
z-index:99999999;
justify-content:center;
align-items:center;
padding:20px;
box-sizing:border-box;
">

<img
id="imgZoom"
style="
max-width:100%;
max-height:100%;
border-radius:20px;
box-shadow:0 0 40px rgba(255,255,255,.15);
">

</div>

</body>
