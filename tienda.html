<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda LDO</title>

<style>
body{
background:#020617;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#0f172a;
padding:15px;
border-radius:15px;
text-align:center;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
}

.precio{
font-size:24px;
font-weight:bold;
color:#38bdf8;
}

.whatsapp{
display:inline-block;
margin-top:10px;
background:#25d366;
color:white;
padding:10px 15px;
border-radius:10px;
text-decoration:none;
}

.cat-btn{
background:#0f172a;
color:white;
border:1px solid #1e293b;
padding:12px 18px;
border-radius:25px;
cursor:pointer;
transition:.3s;
font-size:15px;
margin:3px;
}

.cat-btn:hover{
transform:translateY(-3px);
background:#38bdf8;
box-shadow:0 0 20px rgba(56,189,248,.4);
}

.cat-btn:active{
transform:scale(.95);
}

.buscador{
width:100%;
max-width:500px;
padding:15px 20px;
border:none;
border-radius:30px;
background:#0f172a;
color:white;
font-size:16px;
outline:none;
box-shadow:0 0 15px rgba(56,189,248,.2);
transition:.3s;
}

.buscador:focus{
box-shadow:0 0 25px rgba(56,189,248,.5);
transform:scale(1.02);
}

#barraSuperior{
position:sticky;
top:0;
z-index:998;
background:#020617;
padding:10px 0;
}

#headerLDO{
position:sticky;
top:0;
z-index:9999;
background:#0f172a;
padding:15px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

.logoLDO{
width:70px;
height:70px;
border-radius:18px;
background:linear-gradient(135deg,#38bdf8,#84cc16);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:22px;
color:white;
}

.infoLDO{
text-align:center;
flex:1;
}

.infoLDO h2{
margin:0;
}

.infoLDO p{
margin:5px 0 0;
color:#38bdf8;
font-weight:bold;
}

#carritoBox{
width:70px;
height:70px;
border-radius:18px;
background:#22c55e;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
position:relative;
cursor:pointer;
}

#contadorCarrito{
position:absolute;
top:-8px;
right:-8px;
background:#ef4444;
color:white;
width:28px;
height:28px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:14px;
font-weight:bold;
}
  
</style>
</head>

<body>

<div id="headerLDO">

<div class="logoLDO">
LDO
</div>

<div class="infoLDO">
<h2>LDO Service</h2>
<p id="totalHeader">$0</p>
</div>

</div>

<div id="barraSuperior">

<input
id="buscar"
class="buscador"
placeholder="🔍 Buscar producto..."
onkeyup="buscarProductos()">

</div>

<div style="text-align:center;margin-bottom:20px">

<h2 style="text-align:center">
🔥 Productos Destacados
</h2>

<div class="filtros">
  
<button class="cat-btn" onclick="filtrarCategoria('Todas')">Todos</button>

<button class="cat-btn" onclick="filtrarCategoria('Celulares')">📱 Celulares</button>

<button class="cat-btn" onclick="filtrarCategoria('Accesorios')">🔌 Accesorios</button>

<button class="cat-btn" onclick="filtrarCategoria('Protección')">🛡️ Protección</button>

<button class="cat-btn" onclick="filtrarCategoria('Electrónica')">⚡ Electrónica</button>

<button class="cat-btn" onclick="filtrarCategoria('Ofertas')">🔥 Ofertas</button>

<button class="cat-btn" onclick="filtrarCategoria('Novedades')">✨ Novedades</button>

</div>
  
<div
id="carritoBox"
onclick="verCarrito()"
style="
position:fixed;
top:80px;
right:15px;
background:#38bdf8;
color:#020617;
padding:10px 15px;
border-radius:20px;
font-weight:bold;
z-index:999;
box-shadow:0 0 15px rgba(56,189,248,.5);
cursor:pointer;
">
🛒 0
</div>
  
<div id="productos" class="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>

<script>

let todosProductos = [];
let carrito = JSON.parse(
localStorage.getItem('carritoLDO')
) || [];

function filtrarCategoria(categoria){

const productos =
categoria === 'Todas'
? todosProductos
: todosProductos.filter(
p => p.categoria === categoria
);

mostrarProductos(productos);

}
  
async function cargarProductos(){

const {data,error}=await supabaseClient
.from('productos')
.select('*')
.gt('stock',0)
.order('categoria',{ascending:true})
.order('id',{ascending:false});

if(error){
console.log(error);
alert(error.message);
return;
}

todosProductos = data;

mostrarProductos(data);

}

function mostrarProductos(data){

const div=document.getElementById('productos');

div.innerHTML='';

data.forEach(p=>{

const mensaje=encodeURIComponent(
`Hola, me interesa este producto:\n\n${p.nombre}`
);

div.innerHTML+=`
<div class="card">

<img src="${p.foto || ''}">

<h3>${p.nombre}</h3>

<div style="
background:#38bdf8;
color:#020617;
padding:4px 8px;
border-radius:8px;
display:inline-block;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
">
${p.categoria || 'General'}
</div>

<p style="
color:#cbd5e1;
font-size:16px;
font-weight:500;
margin:10px 0;
min-height:40px;
">
${p.descripcion || ''}
</p>

<div class="precio">
$${Number(p.precio).toLocaleString()}
</div>

<p>
${p.stock > 0
? '🟢 Disponible'
: '🔴 Agotado'}
</p>

${p.stock > 0 ? `
<button
onclick="agregarCarrito(${p.id})"
class="whatsapp"
style="
border:none;
cursor:pointer;
">
🛒 Agregar
</button>
` : `
<div class="whatsapp">
🔴 Sin stock
</div>
`}

</div>
`;

});

}

function agregarCarrito(id){
  
function mostrarToast(){

const toast =
document.getElementById('toastCarrito');

toast.style.display = 'block';

setTimeout(()=>{

toast.style.display = 'none';

},2000);

}

const existente =
carrito.find(p => p.id === id);

if(existente){

existente.cantidad++;

}else{

const producto =
todosProductos.find(p => p.id === id);

carrito.push({
...producto,
cantidad:1
});

}

mostrarToast();

actualizarCarrito();

}

function actualizarCarrito(){

localStorage.setItem(
'carritoLDO',
JSON.stringify(carrito)
);

let total = 0;

carrito.forEach(p=>{
total += Number(p.precio) * (p.cantidad || 1);
});

document.getElementById('contadorCarrito').innerHTML =
carrito.length;

document.getElementById('totalHeader').innerHTML =
'$' + total.toLocaleString();

}

function verCarrito(){

const lista =
document.getElementById('listaCarrito');

const totalBox =
document.getElementById('totalCarrito');

lista.innerHTML = '';

let total = 0;

carrito.forEach((p,index)=>{

const subtotal =
Number(p.precio) * p.cantidad;

total += subtotal;

lista.innerHTML += `
<div style="
display:flex;
justify-content:space-between;
align-items:center;
background:#111827;
padding:10px;
border-radius:10px;
margin-bottom:10px;
gap:10px;
">

<img
src="${p.foto || ''}"
style="
width:70px;
height:70px;
object-fit:cover;
border-radius:10px;
">

<div>
<b>${p.nombre}</b><br>

<div style="
display:flex;
align-items:center;
gap:8px;
margin-top:5px;
">

<button
onclick="restarCantidad(${index})"
style="
background:#ef4444;
color:white;
border:none;
border-radius:6px;
padding:4px 8px;
cursor:pointer;
">
➖
</button>

<b>${p.cantidad}</b>

<button
onclick="sumarCantidad(${index})"
style="
background:#22c55e;
color:white;
border:none;
border-radius:6px;
padding:4px 8px;
cursor:pointer;
">
➕
</button>

</div>

<div style="margin-top:5px">
$${subtotal.toLocaleString()}
</div>

</div>

<button
onclick="eliminarDelCarrito(${index})"
style="
background:#ef4444;
color:white;
border:none;
padding:8px 10px;
border-radius:8px;
">
❌
</button>

</div>
`;

});

totalBox.innerHTML =
`💰 Total: $${total.toLocaleString()}`;

document.getElementById('modalCarrito').style.display =
'flex';

}

function cerrarCarrito(){

document.getElementById('modalCarrito').style.display =
'none';

}

function eliminarDelCarrito(index){

carrito.splice(index,1);

actualizarCarrito();

verCarrito();

}

function sumarCantidad(index){

carrito[index].cantidad++;

actualizarCarrito();

verCarrito();

}

function restarCantidad(index){

if(carrito[index].cantidad > 1){

carrito[index].cantidad--;

}else{

carrito.splice(index,1);

}

actualizarCarrito();

verCarrito();

}

function vaciarCarrito(){

if(!confirm('¿Vaciar todo el carrito?')){
return;
}

carrito = [];

localStorage.removeItem('carritoLDO');

actualizarCarrito();

cerrarCarrito();

}

function finalizarPedido(){

if(carrito.length === 0){
alert('El carrito está vacío');
return;
}

let mensaje = '🛒 NUEVO PEDIDO%0A%0A';

let total = 0;

carrito.forEach(p=>{

mensaje += `📦 ${p.nombre} - $${p.precio}%0A`;

total += Number(p.precio);

});

mensaje += `%0A💰 Total: $${total.toLocaleString()}%0A%0A`;
mensaje += 'Hola, quiero realizar este pedido.';

window.open(
`https://wa.me/543756432527?text=${mensaje}`,
'_blank'
);

}

function buscarProductos(){

const texto =
document.getElementById('buscar')
.value
.toLowerCase();

const filtrados = todosProductos.filter(p =>

(p.nombre || '')
.toLowerCase()
.includes(texto)

);

mostrarProductos(filtrados);

}
  
cargarProductos();

actualizarCarrito();

</script>

<div id="modalCarrito" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
z-index:9999;
justify-content:center;
align-items:center;
">

<div style="
background:#0f172a;
width:90%;
max-width:500px;
padding:20px;
border-radius:20px;
">

<h2>🛒 Mi Carrito</h2>

<div id="listaCarrito"></div>

<h3 id="totalCarrito">
Total: $0
</h3>

<div style="
display:flex;
gap:10px;
margin-top:20px;
">

<button
onclick="finalizarPedido()"
style="
flex:1;
background:#22c55e;
color:white;
border:none;
padding:12px;
border-radius:10px;
">
📲 Comprar
</button>

<button
onclick="vaciarCarrito()"
style="
flex:1;
background:#ef4444;
color:white;
border:none;
padding:12px;
border-radius:10px;
">
🗑️ Vaciar
</button>

</div>

<button
onclick="cerrarCarrito()"
style="
width:100%;
margin-top:10px;
background:#334155;
color:white;
border:none;
padding:12px;
border-radius:10px;
">
Cerrar
</button>

</div>

</div>

<div id="toastCarrito" style="
position:fixed;
bottom:20px;
right:20px;
background:#22c55e;
color:white;
padding:15px 20px;
border-radius:12px;
font-weight:bold;
display:none;
z-index:99999;
box-shadow:0 0 20px rgba(34,197,94,.5);
">
✅ Producto agregado al carrito
</div>

</body>
</html>
