<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión LDO V3</title>
<style>
body{margin:0;padding:20px;background:#020617;color:#e2e8f0;font-family:Arial}
.container{max-width:1500px;margin:auto}
.card{background:#0f172a;padding:20px;border-radius:20px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.stat{background:#111827;padding:15px;border-radius:15px;text-align:center}
.stat p{font-size:28px;color:#38bdf8;font-weight:bold}
input,select,button{padding:10px;border-radius:10px;border:none}
input,select{background:#111827;color:white}
button{cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #1e293b;font-size:13px}
.ok{color:#84cc16;font-weight:bold}
.no{color:#ef4444;font-weight:bold}
.wa{background:#25d366;color:white;padding:6px 10px;border-radius:8px;text-decoration:none}
.del{background:#ef4444;color:white}
.pdf{background:#38bdf8;color:#020617}
@media(max-width:900px){.table-wrap{overflow:auto}}
</style>
</head>
<body>
<div class="container">

<div class="card">
<h1>⚡ Gestión LDO V3</h1>

<div class="stats">
<div class="stat"><h3>Total</h3><p id="total">0</p></div>
<div class="stat"><h3>Reparando</h3><p id="rep">0</p></div>
<div class="stat"><h3>Entregados</h3><p id="ent">0</p></div>
<div class="stat"><h3>Ganancias</h3><p id="gan">$0</p></div>
</div>

<input id="buscar" placeholder="Buscar cliente, equipo u orden" style="width:100%;margin-top:15px" onkeyup="filtrar()">
</div>

<div class="card table-wrap">
<table>
<thead>
<tr>
<th>Orden</th>
<th>Cliente</th>
<th>Equipo</th>
<th>WhatsApp</th>
<th>⚡</th>
<th>🔋</th>
<th>🖼️</th>
<th>💧</th>
<th>💥</th>
<th>Falla</th>
<th>Estado</th>
<th>Monto</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>
<script>
let datos=[];

cargar();

async function cargar(){
const {data,error}=await supabaseClient.from('ordenes').select('*').order('id',{ascending:false});
if(error)return console.log(error);
datos=data||[];
render(datos);
stats();
}

function stats(){
document.getElementById('total').innerHTML=datos.length;
document.getElementById('rep').innerHTML=datos.filter(i=>i.estado==='En reparación').length;
document.getElementById('ent').innerHTML=datos.filter(i=>i.estado==='Entregado').length;

let g=0;
datos.forEach(i=>{
if(i.estado==='Entregado') g+=Number(i.monto||0);
});
document.getElementById('gan').innerHTML='$'+g.toLocaleString();
}

function icono(v){
return (v==='SÍ'||v==='SI') ? '<span class="ok">🟢</span>' : '<span class="no">🔴</span>';
}

function render(arr){
const t=document.getElementById('lista');
t.innerHTML='';

arr.forEach(i=>{
t.innerHTML+=`
<tr>
<td>${i.orden||''}</td>
<td>${i.cliente||''}</td>
<td>${i.equipo||''}</td>
<td>
<a class="wa" target="_blank" href="https://wa.me/${i.telefono||''}">📲</a>

<button onclick="enviarPresupuesto(${i.id})">💰</button>

<button onclick="enviarReparado(${i.id})">🔧</button>

<button onclick="enviarEntregado(${i.id})">📦</button>
</td>
<td>${icono(i.enciende)}</td>
<td>${icono(i.carga)}</td>
<td>${icono(i.imagen)}</td>
<td>${icono(i.mojo)}</td>
<td>${icono(i.caida)}</td>
<td>${i.falla||''}</td>
<td>
<select onchange="estado(${i.id},this.value)">
<option ${i.estado==='Recibido'?'selected':''}>Recibido</option>
<option ${i.estado==='Diagnosticando'?'selected':''}>Diagnosticando</option>
<option ${i.estado==='Esperando repuesto'?'selected':''}>Esperando repuesto</option>
<option ${i.estado==='En reparación'?'selected':''}>En reparación</option>
<option ${i.estado==='Listo para retirar'?'selected':''}>Listo para retirar</option>
<option ${i.estado==='Entregado'?'selected':''}>Entregado</option>
</select>
</td>
<td><input type="number" value="${i.monto||''}" onchange="monto(${i.id},this.value)" style="width:90px"></td>
<td>
<button class="pdf" onclick="pdf(${i.id})">PDF</button>
<button class="del" onclick="eliminar(${i.id})">X</button>
</td>
</tr>`;
});
}

function filtrar(){
const b=document.getElementById('buscar').value.toLowerCase();
render(datos.filter(i=>
(i.cliente||'').toLowerCase().includes(b)||
(i.equipo||'').toLowerCase().includes(b)||
(i.orden||'').toLowerCase().includes(b)
));
}

async function estado(id,v){
await supabaseClient.from('ordenes').update({estado:v}).eq('id',id);
cargar();
}

async function monto(id,v){
await supabaseClient.from('ordenes').update({monto:v}).eq('id',id);
cargar();
}

async function eliminar(id){
if(!confirm('Eliminar orden?')) return;
await supabaseClient.from('ordenes').delete().eq('id',id);
cargar();
}

function pdf(id){
const i=datos.find(x=>x.id===id);
const w=window.open('','_blank');
w.document.write(`
<h1>LDO Servicio Técnico</h1>
<p><b>Orden:</b> ${i.orden}</p>
<p><b>Cliente:</b> ${i.cliente}</p>
<p><b>WhatsApp:</b> ${i.telefono}</p>
<p><b>Equipo:</b> ${i.equipo}</p>
<p><b>Enciende:</b> ${i.enciende}</p>
<p><b>Carga:</b> ${i.carga}</p>
<p><b>Da imagen:</b> ${i.imagen}</p>
<p><b>Se mojó:</b> ${i.mojo}</p>
<p><b>Se cayó:</b> ${i.caida}</p>
<p><b>Falla:</b> ${i.falla}</p>
<p><b>Estado:</b> ${i.estado}</p>
<p><b>Monto:</b> $${i.monto}</p>
`);
w.print();
}
  
function enviarPresupuesto(id){

const i = datos.find(x=>x.id===id);

const mensaje = encodeURIComponent(
`💰 PRESUPUESTO LDO\n\n`+
`👋 Hola ${i.cliente}\n\n`+
`📱 Equipo: ${i.equipo}\n\n`+
`💵 Presupuesto: $${i.monto || 0}\n\n`+
`✅ Si estás de acuerdo responder este mensaje para continuar.\n\n`+
`🔧 LDO Servicio Técnico`
);

window.open(`https://wa.me/${i.telefono}?text=${mensaje}`);
}

async function enviarReparado(id){

const i = datos.find(x=>x.id===id);

await supabaseClient
.from('ordenes')
.update({estado:'Listo para retirar'})
.eq('id',id);

const mensaje = encodeURIComponent(
`🔧 LDO Servicio Técnico\n\n`+
`👋 Hola ${i.cliente}\n\n`+
`📱 Tu equipo ${i.equipo} ya fue reparado correctamente.\n\n`+
`✅ Reparación finalizada\n`+
`✅ Equipo probado\n`+
`✅ Funcionando correctamente\n\n`+
`📍 Estado: LISTO PARA RETIRAR\n\n`+
`🙌 Gracias por confiar en LDO Servicio Técnico`
);

window.open(`https://wa.me/${i.telefono}?text=${mensaje}`);

cargar();
}

async function enviarEntregado(id){

const i = datos.find(x=>x.id===id);

await supabaseClient
.from('ordenes')
.update({estado:'Entregado'})
.eq('id',id);

const mensaje = encodeURIComponent(
`📦 ENTREGA REALIZADA\n\n`+
`👋 Hola ${i.cliente}\n\n`+
`📱 Equipo: ${i.equipo}\n\n`+
`✅ Trabajo finalizado\n`+
`✅ Equipo entregado correctamente\n\n`+
`🔒 Conservá tu comprobante de garantía.\n\n`+
`🙌 Gracias por elegir LDO Servicio Técnico`
);

window.open(`https://wa.me/${i.telefono}?text=${mensaje}`);

cargar();
}
</script>
</body>
</html>
