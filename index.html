<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>LDO Servicio Técnico</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#020617;color:#e2e8f0}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#0f172a;padding:20px;border-radius:20px;margin:15px 0}
.logo{width:180px;display:block;margin:auto;border-radius:20px}
h1,h2{text-align:center}
input,select,textarea,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none}
button{background:#06b6d4;color:white;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<img src="icon.png" class="logo">
<h1>LDO Servicio Técnico</h1>

<div class="card">
<h2>Consultar estado</h2>
<input id="buscarOrden" placeholder="LDO-123456">
<button onclick="consultarEstado()">Consultar</button>
<div id="resultadoEstado"></div>
</div>

<div class="card">
<h2>Nueva solicitud</h2>
<input id="cliente" placeholder="Nombre completo">
<input id="telefono" placeholder="WhatsApp">
<input id="equipo" placeholder="Marca y modelo">
<textarea id="falla" placeholder="Describe la falla"></textarea>

<div class="grid">
<select id="enciende"><option>SÍ</option><option>NO</option></select>
<select id="carga"><option>SÍ</option><option>NO</option></select>
<select id="imagen"><option>SÍ</option><option>NO</option></select>
<select id="mojo"><option>SÍ</option><option>NO</option></select>
</div>

<button onclick="enviar()">Enviar solicitud</button>
<div id="msg"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>
<script>
async function consultarEstado(){
 const orden=document.getElementById('buscarOrden').value;
 const r=document.getElementById('resultadoEstado');
 const {data,error}=await supabaseClient.from('ordenes').select('*').eq('orden',orden).single();
 if(error||!data){r.innerHTML='Orden no encontrada';return;}
 r.innerHTML=`<p><b>${data.equipo}</b><br>Estado: ${data.estado}</p>`;
}

async function enviar(){
 const cliente=clienteEl.value;
 const telefono=telefonoEl.value;
 const equipo=equipoEl.value;
 const falla=fallaEl.value;
 if(!cliente||!telefono||!equipo||!falla){msg.innerHTML='Completa todos los campos';return;}
 const item={
  orden:'LDO-'+Date.now(),
  fecha:new Date().toLocaleString(),
  cliente,telefono,equipo,falla,
  enciende:enciende.value,carga:carga.value,imagen:imagen.value,mojo:mojo.value,
  estado:'Recibido',monto:''
 };
 const {error}=await supabaseClient.from('ordenes').insert([item]);
 if(error){msg.innerHTML='Error al guardar';return;}
 msg.innerHTML='Solicitud enviada. Orden: <b>'+item.orden+'</b>';
}
const clienteEl=document.getElementById('cliente');
const telefonoEl=document.getElementById('telefono');
const equipoEl=document.getElementById('equipo');
const fallaEl=document.getElementById('falla');
const msg=document.getElementById('msg');
</script>
</body>
</html>
