<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda LDO</title>

<style>
body{
background:#020617;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#0f172a;
padding:15px;
border-radius:15px;
text-align:center;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
}

.precio{
font-size:24px;
font-weight:bold;
color:#38bdf8;
}

.whatsapp{
display:inline-block;
margin-top:10px;
background:#25d366;
color:white;
padding:10px 15px;
border-radius:10px;
text-decoration:none;
}
</style>
</head>

<body>

<div style="
background:linear-gradient(135deg,#38bdf8,#84cc16);
padding:30px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
">

<h1 style="margin:0;color:white">
🛒 Tienda LDO
</h1>

<p style="margin-top:10px;color:white">
Celulares • Fundas • Vidrios • Cargadores • Electrónica
</p>

</div>

<input
id="buscarProducto"
placeholder="🔍 Buscar producto..."
onkeyup="buscarProductos()"
style="max-width:500px;margin:15px auto;display:block;">
  
<div style="text-align:center;margin-bottom:20px">

<h2 style="text-align:center">
🔥 Productos Destacados
</h2>

<div class="filtros">
  
<button class="cat-btn" onclick="filtrarCategoria('Todas')">Todos</button>

<button onclick="filtrarCategoria('Celulares')">📱 Celulares</button>

<button onclick="filtrarCategoria('Accesorios')">🔌 Accesorios</button>

<button onclick="filtrarCategoria('Protección')">🛡️ Protección</button>

<button onclick="filtrarCategoria('Electrónica')">⚡ Electrónica</button>

<button onclick="filtrarCategoria('Ofertas')">🔥 Ofertas</button>

<button onclick="filtrarCategoria('Novedades')">✨ Novedades</button>

</div>
  
<div id="productos" class="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>

<script>

let todosProductos = [];

function filtrarCategoria(categoria){

const productos =
categoria === 'Todas'
? todosProductos
: todosProductos.filter(
p => p.categoria === categoria
);

mostrarProductos(productos);

}
  
async function cargarProductos(){

const {data,error}=await supabaseClient
.from('productos')
.select('*')
.gt('stock',0)
.order('categoria',{ascending:true})
.order('id',{ascending:false});

if(error){
console.log(error);
alert(error.message);
return;
}

todosProductos = data;

mostrarProductos(data);

}

function mostrarProductos(data){

const div=document.getElementById('productos');

div.innerHTML='';

data.forEach(p=>{

const mensaje=encodeURIComponent(
`Hola, me interesa este producto:\n\n${p.nombre}`
);

div.innerHTML+=`
<div class="card">

<img src="${p.foto || ''}">

<h3>${p.nombre}</h3>

<div style="
background:#38bdf8;
color:#020617;
padding:4px 8px;
border-radius:8px;
display:inline-block;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
">
${p.categoria || 'General'}
</div>

<p>🏷️ ${p.categoria || 'Sin categoría'}</p>

<div class="precio">
$${Number(p.precio).toLocaleString()}
</div>

<p>
${p.stock > 0
? '🟢 Disponible (' + p.stock + ')'
: '🔴 Agotado'}
</p>

${p.stock > 0 ? `
<a
class="whatsapp"
target="_blank"
href="https://wa.me/543756432527?text=${mensaje}">
📲 Consultar
</a>
` : `
<div class="whatsapp">
🔴 Sin stock
</div>
`}

</div>
`;

});

}

function buscarProductos(){

const texto =
document.getElementById('buscarProducto')
.value
.toLowerCase();

const filtrados = todosProductos.filter(p =>

(p.nombre || '')
.toLowerCase()
.includes(texto)

);

mostrarProductos(filtrados);

}
  
cargarProductos();

</script>

</body>
</html>
